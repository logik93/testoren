name: Native builds and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose release should receive the native binaries
        required: true
        default: v0.9.1

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.event_name == 'pull_request' && github.ref || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  LOGISTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  started:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record build start
        env:
          REPORT_PHASE: building
        run: python3 scripts/write_ci_status.py

  plugins:
    name: Build ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            parallel: 2
          - os: windows-2022
            platform: windows-x86_64
            parallel: 2
          - os: macos-15-intel
            platform: macos-universal
            parallel: 4
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Build, test, verify architecture and package
        run: python scripts/build_native.py --platform ${{ matrix.platform }} --output native-out --parallel ${{ matrix.parallel }} --reuse
      - name: Retain binaries and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native-out/
          if-no-files-found: error
          retention-days: 14
      - name: Record native platform result
        if: always() && github.event_name != 'pull_request'
        env:
          REPORT_PLATFORM: ${{ matrix.platform }}
          REPORT_PHASE: ${{ job.status == 'success' && 'passed' || 'failed' }}
        run: python scripts/write_ci_status.py

  publish:
    if: github.event_name != 'pull_request'
    needs: plugins
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ci-artifacts
      - name: Verify source identity and upload all native builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_native_release.py --tag "$RELEASE_TAG" --artifacts ci-artifacts --result native-release-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-receipt
          path: native-release-result.json
          if-no-files-found: error

  report:
    if: always() && github.event_name != 'pull_request'
    needs: [started, plugins, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ci-artifacts
      - name: Locate publication receipt
        if: needs.publish.result == 'success'
        run: cp ci-artifacts/native-release-receipt/native-release-result.json native-release-result.json
      - name: Record outcome and verified download links
        env:
          REPORT_PHASE: ${{ needs.publish.result == 'success' && 'published' || 'failed' }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/write_ci_status.py
